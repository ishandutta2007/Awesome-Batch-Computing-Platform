<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-20px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .node-pulse { animation: pulse 4s infinite ease-in-out; transform-origin: center; }
    .particle-1 { animation: floatParticle 6s infinite ease-in-out; }
    .particle-2 { animation: floatParticle 8s infinite ease-in-out 1s; }
    .particle-3 { animation: floatParticle 5s infinite ease-in-out 2s; }
    .data-stream { stroke-dasharray: 20, 10; animation: flowLine 12s linear infinite; }
  </style>

  <!-- Dark Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Background Animated Graphics (Low opacity behind text) -->
  <g opacity="0.25">
    <!-- Grid -->
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200" stroke="#334155" stroke-width="1"/>
    <path d="M150 0 V400 M300 0 V400 M450 0 V400 M600 0 V400 M750 0 V400 M900 0 V400 M1050 0 V400" stroke="#334155" stroke-width="1"/>

    <!-- Batch Computing Flow Pipes & Nodes -->
    <path class="data-stream" d="M 100 320 Q 300 360 500 300 T 900 340 T 1100 280" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path class="data-stream" d="M 100 80 Q 400 30 700 90 T 1100 60" fill="none" stroke="#a855f7" stroke-width="2"/>

    <!-- Decorative Cluster Pills -->
    <rect class="node-pulse" x="80" y="50" width="140" height="36" rx="18" fill="url(#accent-cyan)"/>
    <rect class="node-pulse" x="980" y="310" width="150" height="36" rx="18" fill="url(#accent-purple)"/>
    
    <!-- Floating particles -->
    <circle class="particle-1" cx="200" cy="120" r="6" fill="#38bdf8"/>
    <circle class="particle-2" cx="1020" cy="140" r="8" fill="#818cf8"/>
    <circle class="particle-3" cx="150" cy="280" r="5" fill="#c084fc"/>
    <circle class="particle-1" cx="1050" cy="220" r="7" fill="#38bdf8"/>
  </g>

  <!-- Foreground Main Title & Subtitle Card Container -->
  <g transform="translate(600, 200)" text-anchor="middle">
    <!-- Title -->
    <text x="0" y="-30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="52" fill="url(#title-grad)" filter="url(#glow)" letter-spacing="1">
      Awesome Batch Computing Platform
    </text>

    <!-- Subtitle Badge / Subheading -->
    <rect x="-420" y="0" width="840" height="46" rx="23" fill="#0f172a" fill-opacity="0.85" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="20" fill="#e2e8f0" letter-spacing="0.5">
      ⚙️ Top Commercial Batch Platforms &amp; Open-Source Workload Schedulers ☁️
    </text>

    <!-- Category Pills -->
    <g transform="translate(0, 80)">
      <rect x="-310" y="0" width="180" height="30" rx="15" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
      <text x="-220" y="19" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🏔️ HPC Workload</text>

      <rect x="-110" y="0" width="180" height="30" rx="15" fill="#1e293b" stroke="#7c3aed" stroke-width="1"/>
      <text x="-20" y="19" font-family="sans-serif" font-size="13" font-weight="600" fill="#a78bfa">☁️ Cloud Managed</text>

      <rect x="90" y="0" width="220" height="30" rx="15" fill="#1e293b" stroke="#059669" stroke-width="1"/>
      <text x="200" y="19" font-family="sans-serif" font-size="13" font-weight="600" fill="#34d399">⚡ Distributed Job Queues</text>
    </g>
  </g>
</svg>
