<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".3"/></linearGradient><linearGradient id="accent-purple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".8"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".3"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-20px) translateX(15px);opacity:.8}}@keyframes flowLine{0%{stroke-dashoffset:400}}.node-pulse{animation:pulse 4s infinite ease-in-out;transform-origin:center}.particle-1{animation:floatParticle 6s infinite ease-in-out}.particle-2{animation:floatParticle 8s infinite ease-in-out 1s}.particle-3{animation:floatParticle 5s infinite ease-in-out 2s}.data-stream{stroke-dasharray:20,10;animation:flowLine 12s linear infinite}</style><rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/><g opacity=".25"><path stroke="#334155" stroke-width="1" d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200"/><path stroke="#334155" stroke-width="1" d="M150 0 V400 M300 0 V400 M450 0 V400 M600 0 V400 M750 0 V400 M900 0 V400 M1050 0 V400"/><path fill="none" stroke="#38bdf8" stroke-width="3" d="M 100 320 Q 300 360 500 300 T 900 340 T 1100 280" class="data-stream"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M 100 80 Q 400 30 700 90 T 1100 60" class="data-stream"/><rect width="140" height="36" x="80" y="50" fill="url(#accent-cyan)" class="node-pulse" rx="18"/><rect width="150" height="36" x="980" y="310" fill="url(#accent-purple)" class="node-pulse" rx="18"/><circle cx="200" cy="120" r="6" fill="#38bdf8" class="particle-1"/><circle cx="1020" cy="140" r="8" fill="#818cf8" class="particle-2"/><circle cx="150" cy="280" r="5" fill="#c084fc" class="particle-3"/><circle cx="1050" cy="220" r="7" fill="#38bdf8" class="particle-1"/></g><g text-anchor="middle" transform="translate(600, 200)"><text x="0" y="-30" fill="url(#title-grad)" filter="url(#glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="1">Awesome Batch Computing Platform</text><rect width="840" height="46" x="-420" y="0" fill="#0f172a" fill-opacity=".85" stroke="#475569" stroke-width="1.5" rx="23"/><text x="0" y="29" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing=".5">⚙️ Top Commercial Batch Platforms &amp; Open-Source Workload Schedulers ☁️</text><g transform="translate(0, 80)"><rect width="180" height="30" x="-310" y="0" fill="#1e293b" stroke="#0284c7" stroke-width="1" rx="15"/><text x="-220" y="19" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">🏔️ HPC Workload</text><rect width="180" height="30" x="-110" y="0" fill="#1e293b" stroke="#7c3aed" stroke-width="1" rx="15"/><text x="-20" y="19" fill="#a78bfa" font-family="sans-serif" font-size="13" font-weight="600">☁️ Cloud Managed</text><rect width="220" height="30" x="90" y="0" fill="#1e293b" stroke="#059669" stroke-width="1" rx="15"/><text x="200" y="19" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="600">⚡ Distributed Job Queues</text></g></g></svg>